[project]
name = "ugc-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.5,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20", "boto3>=1.35,<2", "stripe>=12,<15", "Pillow>=11,<13", "beautifulsoup4>=4.12,<5", "redis>=5,<7"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

[tool.setuptools.package-data]
app = ["fixtures/*.mp4", "creative_skills/manifest.json", "creative_skills/vendor/**/*"]
