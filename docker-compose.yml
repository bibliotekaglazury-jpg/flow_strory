name: ugc-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ugc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ugc_local_only}
      POSTGRES_DB: ugc
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ugc -d ugc']
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
